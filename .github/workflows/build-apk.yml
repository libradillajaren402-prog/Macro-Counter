
name: Build Macro Counter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap with Capacitor 6 for Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.macrocounter.app",
            "appName": "Macro Counter",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Macro-Counter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
